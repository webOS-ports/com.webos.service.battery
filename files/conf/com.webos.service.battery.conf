[general]
debug = 0

[battery]
fake_battery = false

disable_charging = false

# Shut the device down at or below this percentage while nothing is charging it,
# after three consecutive readings. This is a backstop for boards whose nyx
# battery module never raises NYX_BATTERY_CRITICAL_VOLTAGE, which is otherwise
# the only thing standing between a running device and a flat battery.
# 0 disables it and leaves the voltage and temperature triggers alone.
critical_percent = 2
